<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAUTRAL</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">C</span><span>CAUTRAL</span></div>
      <nav class="modes" id="modes"></nav>
      <button class="clear" id="clearBtn">Xoá cuộc trò chuyện</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu" id="menuBtn" aria-label="Menu">☰</button>
        <div>
          <h1 id="modeTitle"></h1>
          <p id="modeDesc"></p>
        </div>
      </header>

      <section class="chat" id="chat"></section>

      <footer class="composer">
        <div class="attachment" id="attachment" hidden></div>
        <form id="form">
          <button type="button" class="icon" id="attachBtn" title="Đính kèm file dữ liệu (CSV, JSON, TXT, MD)">📎</button>
          <input type="file" id="file" accept=".csv,.tsv,.json,.txt,.md,.log" hidden />
          <textarea id="input" rows="1" placeholder="Nhập tin nhắn..."></textarea>
          <button type="submit" class="send" id="sendBtn">Gửi</button>
        </form>
      </footer>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
